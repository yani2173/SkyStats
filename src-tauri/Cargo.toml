[package]
name = "skystats"
version = "0.9.1"
description = "VATSIM flight status for Discord"
authors = ["SkyStats contributors"]
edition = "2021"

[lib]
name = "skystats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
discord-rich-presence = "1.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1

# Pre-optimize third-party dependencies so debug/test compiles are fast
[profile.dev.package."*"]
opt-level = 2
